<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something For You 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#fff8fb;
  color:#4b3b42;
  font-family:"DM Sans",sans-serif;
}

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,190,215,.55),transparent 30%),
    radial-gradient(circle at 80% 30%,rgba(255,220,232,.7),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(255,205,225,.55),transparent 40%),
    linear-gradient(135deg,#fffafd,#fff4f8,#ffffff);
}

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,185,215,.22);
  filter:blur(70px);
  animation:floatGlow 9s ease-in-out infinite alternate;
}

.one{
  top:-120px;
  left:-100px;
}

.two{
  right:-140px;
  bottom:-120px;
  animation-delay:2s;
}

@keyframes floatGlow{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(50px,30px) scale(1.15)}
}

.heart{
  position:absolute;
  font-size:20px;
  opacity:.5;
  animation:floatHeart linear infinite;
}

.h1{left:8%;bottom:-40px;animation-duration:10s}
.h2{left:22%;bottom:-50px;animation-duration:13s;animation-delay:2s}
.h3{left:42%;bottom:-40px;animation-duration:11s;animation-delay:4s}
.h4{left:65%;bottom:-50px;animation-duration:14s;animation-delay:1s}
.h5{left:82%;bottom:-40px;animation-duration:12s;animation-delay:3s}

@keyframes floatHeart{
  0%{
    transform:translateY(0) rotate(0);
    opacity:0;
  }
  15%{opacity:.55}
  85%{opacity:.4}
  100%{
    transform:translateY(-115vh) rotate(20deg);
    opacity:0;
  }
}

.scene{
  position:relative;
  z-index:5;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.content{
  max-width:700px;
  animation:appear 1.5s ease forwards;
}

.small{
  font-size:13px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#b77c91;
  margin-bottom:22px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(45px,7vw,75px);
  font-weight:400;
  line-height:1.05;
  color:#493941;
  margin-bottom:22px;
}

.message{
  max-width:500px;
  margin:auto;
  font-size:17px;
  line-height:1.8;
  color:#725f68;
}

.message span{
  display:block;
  margin-top:7px;
}

/* BEAR */

.bear{
  width:170px;
  height:150px;
  margin:0 auto 30px;
  position:relative;
  animation:breathe 3s ease-in-out infinite;
}

.ear{
  position:absolute;
  width:58px;
  height:58px;
  background:#c99b82;
  border-radius:50%;
  top:5px;
}

.ear:after{
  content:"";
  position:absolute;
  inset:11px;
  background:#e9c1b0;
  border-radius:50%;
}

.ear.left{left:5px}
.ear.right{right:5px}

.face{
  position:absolute;
  width:135px;
  height:120px;
  background:#d7ad94;
  border-radius:48% 48% 45% 45%;
  left:18px;
  top:25px;
  box-shadow:0 12px 25px rgba(120,80,70,.12);
}

.eye{
  position:absolute;
  width:9px;
  height:11px;
  background:#4b3733;
  border-radius:50%;
  top:48px;
}

.eye.left{left:40px}
.eye.right{right:40px}

.muzzle{
  position:absolute;
  width:52px;
  height:38px;
  background:#edcdbb;
  border-radius:50%;
  left:42px;
  top:65px;
}

.nose{
  position:absolute;
  width:12px;
  height:9px;
  background:#4b3733;
  border-radius:50%;
  top:7px;
  left:20px;
}

.mouth{
  position:absolute;
  width:18px;
  height:10px;
  border-bottom:2px solid #4b3733;
  border-radius:50%;
  left:17px;
  top:15px;
}

.heart-held{
  position:absolute;
  font-size:38px;
  left:65px;
  bottom:-15px;
  animation:heartBeat 1.6s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.bottom{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  font-size:11px;
  letter-spacing:3px;
  color:#c39baa;
}

</style>
</head>

<body>

<div class="background">

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="heart h1">♡</div>
  <div class="heart h2">♡</div>
  <div class="heart h3">♡</div>
  <div class="heart h4">♡</div>
  <div class="heart h5">♡</div>

</div>

<section class="scene">

  <div class="content">

    <div class="bear">

      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="face">

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="muzzle">
          <div class="nose"></div>
          <div class="mouth"></div>
        </div>

      </div>

      <div class="heart-held">🩷</div>

    </div>

    <div class="small">A little reminder</div>

    <h1>Take a little breath.</h1>

    <div class="message">
      You don't have to figure everything out today.
      <span>Just take it one little step at a time. 🧸</span>
    </div>

  </div>

  <div class="bottom">
    ONE LITTLE STEP AT A TIME · 🤍
  </div>

</section>

</body>
</html>
