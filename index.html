<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something For You 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#fff9fc;
  color:#44363d;
  font-family:"DM Sans",sans-serif;
}

/* =========================
   ATMOSPHERE
========================= */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,185,211,.48),transparent 28%),
    radial-gradient(circle at 82% 22%,rgba(255,220,234,.62),transparent 32%),
    radial-gradient(circle at 52% 90%,rgba(255,196,220,.42),transparent 38%),
    linear-gradient(135deg,#fffafd 0%,#fff4f8 48%,#ffffff 100%);
}

.light{
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:rgba(255,206,225,.2);
  filter:blur(90px);
  animation:lightMove 13s ease-in-out infinite alternate;
}

.light.one{
  top:-230px;
  left:-150px;
}

.light.two{
  right:-220px;
  bottom:-230px;
  animation-delay:3s;
}

@keyframes lightMove{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(80px,50px) scale(1.15);
  }
}

/* =========================
   PETALS
========================= */

.petal{
  position:absolute;
  width:8px;
  height:13px;
  background:#efb3c9;
  border-radius:100% 0 100% 0;
  opacity:.35;
  animation:drift linear infinite;
}

.p1{left:10%;top:12%;animation-duration:13s}
.p2{left:28%;top:72%;animation-duration:16s;animation-delay:2s}
.p3{left:72%;top:18%;animation-duration:14s;animation-delay:4s}
.p4{left:87%;top:66%;animation-duration:18s;animation-delay:1s}
.p5{left:55%;top:5%;animation-duration:15s;animation-delay:3s}

@keyframes drift{
  0%{
    transform:translate3d(0,0,0) rotate(0deg);
    opacity:0;
  }
  20%{opacity:.35}
  80%{opacity:.25}
  100%{
    transform:translate3d(70px,100px,0) rotate(180deg);
    opacity:0;
  }
}

/* =========================
   SCENE
========================= */

.scene{
  position:relative;
  z-index:5;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.content{
  width:min(720px,100%);
  animation:sceneIn 2s cubic-bezier(.2,.7,.2,1) forwards;
}

/* =========================
   FLOWER
========================= */

.flower{
  position:relative;
  width:145px;
  height:180px;
  margin:0 auto 18px;
  animation:flowerFloat 4s ease-in-out infinite;
}

.stem{
  position:absolute;
  width:5px;
  height:105px;
  background:#9bb49c;
  border-radius:10px;
  left:70px;
  top:65px;
  transform-origin:bottom;
  animation:stemGrow 2s ease forwards;
}

.leaf{
  position:absolute;
  width:42px;
  height:23px;
  background:#aec6ae;
  border-radius:100% 0 100% 0;
  transform-origin:left center;
  opacity:0;
  animation:leafIn 1.4s ease forwards;
}

.leaf.left{
  left:28px;
  top:115px;
  transform:rotate(25deg);
  animation-delay:1.1s;
}

.leaf.right{
  left:73px;
  top:93px;
  transform:rotate(-25deg) scaleX(-1);
  animation-delay:1.3s;
}

.bloom{
  position:absolute;
  width:88px;
  height:88px;
  left:28px;
  top:15px;
  animation:bloomIn 1.8s cubic-bezier(.2,.8,.2,1) forwards;
  transform:scale(.2);
  opacity:0;
}

.petalFlower{
  position:absolute;
  width:43px;
  height:58px;
  left:23px;
  top:14px;
  background:linear-gradient(145deg,#f5b7cf,#df91b1);
  border-radius:55% 55% 45% 45%;
  transform-origin:50% 75%;
}

.petalFlower:nth-child(1){transform:rotate(0deg) translateY(-20px)}
.petalFlower:nth-child(2){transform:rotate(60deg) translateY(-20px)}
.petalFlower:nth-child(3){transform:rotate(120deg) translateY(-20px)}
.petalFlower:nth-child(4){transform:rotate(180deg) translateY(-20px)}
.petalFlower:nth-child(5){transform:rotate(240deg) translateY(-20px)}
.petalFlower:nth-child(6){transform:rotate(300deg) translateY(-20px)}

.center{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#f4d58b;
  left:30px;
  top:30px;
  box-shadow:0 0 0 7px rgba(244,213,139,.15);
}

@keyframes stemGrow{
  from{transform:scaleY(0)}
  to{transform:scaleY(1)}
}

@keyframes leafIn{
  from{
    opacity:0;
    transform:scale(.2) rotate(25deg);
  }
  to{
    opacity:1;
  }
}

@keyframes bloomIn{
  0%{
    opacity:0;
    transform:scale(.2) rotate(-15deg);
  }
  70%{
    opacity:1;
    transform:scale(1.08) rotate(3deg);
  }
  100%{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

@keyframes flowerFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

/* =========================
   TEXT
========================= */

.eyebrow{
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#b47a90;
  margin-bottom:19px;
  opacity:0;
  animation:textIn 1.2s ease forwards;
  animation-delay:1.1s;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,6vw,66px);
  font-weight:400;
  line-height:1.1;
  color:#44363d;
  margin-bottom:26px;
  opacity:0;
  animation:textIn 1.2s ease forwards;
  animation-delay:1.3s;
}

.verse{
  max-width:610px;
  margin:auto;
  font-size:18px;
  line-height:1.8;
  color:#6d5962;
  opacity:0;
  animation:textIn 1.2s ease forwards;
  animation-delay:1.7s;
}

.reference{
  display:block;
  margin-top:17px;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#b47a90;
}

.final-line{
  margin-top:27px;
  font-family:"Playfair Display",serif;
  font-size:24px;
  color:#9d637b;
  opacity:0;
  animation:textIn 1.2s ease forwards;
  animation-delay:2.5s;
}

@keyframes textIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes sceneIn{
  from{
    opacity:0;
    transform:scale(.97);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================
   FOOTER
========================= */

.bottom{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  font-size:10px;
  letter-spacing:3px;
  color:#c59cab;
}

</style>
</head>

<body>

<div class="background">

  <div class="light one"></div>
  <div class="light two"></div>

  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="petal p5"></div>

</div>

<section class="scene">

  <div class="content">

    <div class="flower">

      <div class="stem"></div>

      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="bloom">

        <div class="petalFlower"></div>
        <div class="petalFlower"></div>
        <div class="petalFlower"></div>
        <div class="petalFlower"></div>
        <div class="petalFlower"></div>
        <div class="petalFlower"></div>

        <div class="center"></div>

      </div>

    </div>

    <div class="eyebrow">A little reminder</div>

    <h1>You are never alone.</h1>

    <div class="verse">

      “The Lord is near to the brokenhearted
      and saves the crushed in spirit.”

      <span class="reference">
        Psalm 34:18
      </span>

    </div>

    <div class="final-line">
      We’ve got your back. 🤍
    </div>

  </div>

  <div class="bottom">
    WITH LOVE · ALWAYS
  </div>

</section>

</body>
</html>
